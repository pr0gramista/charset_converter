name: "Test example"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
jobs:
  integration-tests:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            device: linux
          - os: windows-latest
            device: windows
          - os: macos-latest
            device: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Pub get
        run: flutter pub get
      - name: Run integration tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a flutter test -d ${{ matrix.device }} -r expanded integration_test
      - name: Run integration tests
        if: matrix.os != 'ubuntu-latest'
        run: flutter test -d ${{ matrix.device }} -r expanded integration_test

  ios-integration-tests:
    name: Integration tests (iOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Launch iOS simulator
        run: |
          flutter emulators --launch apple_ios_simulator
          sleep 15
      - name: Run integration tests
        run: flutter test -d iPhone -r expanded integration_test

  android-integration-tests:
    name: Integration tests (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
        working-directory: example
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: example
          script: flutter test -d emulator-5554 -r expanded integration_test
